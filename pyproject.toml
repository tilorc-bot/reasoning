[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reasoning"
version = "0.1.0"
description = "Independent SAT reasoning with a SymPy integration"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
sympy = [
    "sympy @ git+https://github.com/sympy/sympy.git@ddbb536d7e803e4c38d5d5808ad1217368b12655",
]

dev = ["hypothesis", "pytest", "mypy"]

[tool.setuptools.package-data]
reasoning = ["LICENSE.sympy"]

[tool.setuptools.packages.find]
include = ["reasoning*"]

[tool.pytest.ini_options]
testpaths = ["reasoning/tests", "validation", "tests"]
markers = [
    "slow: slow upstream SymPy test",
    "tooslow: very slow upstream SymPy test",
    "nocache_fail: upstream test requiring SymPy caching",
]

[tool.mypy]
python_version = "3.10"
files = ["reasoning", "benchmarks", "validation", "tools", "conftest.py"]
strict = true

[[tool.mypy.overrides]]
module = ["sympy", "sympy.*"]
follow_imports = "skip"
